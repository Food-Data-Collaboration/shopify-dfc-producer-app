name: Production deploy

on:
  push:
    branches: ['main']

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn --cwd web install --frozen-lockfile
      - run: yarn --cwd web/frontend install --frozen-lockfile
      - run: yarn --cwd web/frontend build
        env:
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY_PRODUCTION }}
      - run: npx playwright install chromium --with-deps
      - run: NODE_ENV=production MOCK_BRIDGE=1 npx playwright test
        env:
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY_PRODUCTION }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-production
          path: playwright-report/
          retention-days: 7

  build-and-push-image:
    needs: [frontend-test]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      jelastic_env: ofn-producer
    secrets:
      jelastic_access_token: ${{ secrets.JELASTIC_ACCESS_TOKEN }}
      shopify_api_key: ${{ secrets.SHOPIFY_API_KEY_PRODUCTION }}
