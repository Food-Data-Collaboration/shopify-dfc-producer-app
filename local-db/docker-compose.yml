version: '3.3'
services:
  postgres:
    container_name: container-pg
    # Pinned: the `postgres:latest` tag is now 18+, which stores data under
    # /var/lib/postgresql/<major> and refuses to start against the
    # /var/lib/postgresql/data mount below. Pin until the compose file is
    # updated for the 18+ layout.
    image: postgres:16-alpine
    # SSL is required: connect.js opens every pool with
    # `ssl: { rejectUnauthorized: false, require: true }`. The certs are
    # generated by scripts/setup-test-db.sh into local-db/certs/ (no root
    # needed); the self-signed one is fine because the client already ignores
    # verification errors.
    command: >-
      -c ssl=on
      -c ssl_cert_file=/certs/server.crt
      -c ssl_key_file=/certs/server.key
    hostname: localhost
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-database.sql:/docker-entrypoint-initdb.d/init-database.sql:ro
      # NOT bind-mounted: postgres refuses to start unless the private key is
      # owned by the database user, and a bind mount keeps the host uid.
      # scripts/setup-test-db.sh copies server.crt/server.key in here and
      # chowns them to 70:70 after the first start.
      - test-certs:/certs
    restart: unless-stopped

  pgadmin:
    container_name: container-pgadmin
    image: dpage/pgadmin4
    depends_on:
      - postgres
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    restart: unless-stopped

volumes:
  postgres-data:
  test-certs:
